name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3 # installs the toolchain pinned in mise.toml
      - run: npm ci
      - run: npm run check
      - run: npm run build

  # Informational: reports line/branch coverage on the run summary, never fails the build.
  coverage:
    if: github.event_name == 'pull_request' # not on the deploy run, which reuses this workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: npm ci
      - run: npm run test:coverage
      - name: Coverage summary
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered} / ${t[k].total} |`;
            console.log(["## Coverage", "| | % | covered |", "|---|---|---|", ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
