name: Android release

# Tag vX.Y.Z on main -> bundled (Capacitor) APK attached to a GitHub release. The F-Droid repo at
# https://fdroid.garand.dev picks new releases up (AntonyGarand/fdroid). The Play Store app is the TWA
# in android/ and is released by hand.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # __APP_VERSION__ reads the commit
      - uses: jdx/mise-action@v3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run check
      - run: npm run build:android

      - name: Version from tag
        id: v
        run: |
          v="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$v"
          echo "name=$v" >> "$GITHUB_OUTPUT"
          echo "code=$((major * 10000 + minor * 100 + patch))" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        working-directory: android-foss
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_FOSS_KEYSTORE_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_FOSS_KEYSTORE_B64 }}" | base64 -d > "$ANDROID_KEYSTORE"
          ./gradlew --no-daemon assembleRelease -PversionCode=${{ steps.v.outputs.code }} -PversionName=${{ steps.v.outputs.name }}
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/puzzle-feed-${{ steps.v.outputs.name }}.apk"
          rm "$ANDROID_KEYSTORE"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/puzzle-feed-${{ steps.v.outputs.name }}.apk" --title "$GITHUB_REF_NAME" --generate-notes
