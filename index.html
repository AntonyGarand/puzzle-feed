    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <meta name="apple-mobile-web-app-title" content="puzzles" />
    <meta name="mobile-web-app-capable" content="yes" />
    <script>
      // Plausible pageviews -> stats.garand.dev (own site + "garand.dev" rollup).
      // Opt out: Settings > Anonymous stats (puzzle-feed:analytics-off), or localStorage.plausible_ignore = "true".
      (function () {
        if (!/(^|\.)garand\.dev$/.test(location.hostname)) return;
        try {
          if (localStorage.getItem('plausible_ignore') === 'true') return;
          if (localStorage.getItem('puzzle-feed:analytics-off') === '1') return;
        } catch (e) {}
        var last;
        function pageview() {
          if (location.href === last) return;
          last = location.href;
          fetch('https://stats.garand.dev/api/event', {
            method: 'POST',
            keepalive: true,
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify({ n: 'pageview', u: last, d: location.hostname + ',garand.dev', r: document.referrer || null, h: 1 }),
          }).catch(function () {});
        }
        pageview();
        // Path routing: in-app navigations are history.pushState calls (src/core/nav.ts).
        var push = history.pushState;
        history.pushState = function () {
          push.apply(history, arguments);
          pageview();
        };
        addEventListener('popstate', pageview);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
